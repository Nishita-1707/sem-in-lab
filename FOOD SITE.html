```html
<!DOCTYPE html>
<html>
<head>
    <title>Foodie</title>

    <style>
        body {
            font-family: Arial;
            background: #fff3e0;
            text-align: center;
            margin: 0;
        }

        nav, footer {
            background: #e65100;
            color: white;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        h2 {
            color: #e65100;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px gray;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .offer {
            background: #ffcc80;
            padding: 20px;
            color: #bf360c;
        }
    </style>
</head>

<body>

    <nav>
        🍔 Foodie |
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#offers">Offers</a>
        <a href="#contact">Contact</a>
    </nav>

    <h1 id="home">Delicious Food Delivered!</h1>

    <h2>Categories</h2>
    <p>🍕 Pizza | 🍔 Burger | 🍜 Noodles | 🍰 Desserts</p>

    <h2 id="menu">Popular Foods</h2>

    <div class="grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" alt="Pizza">
            <h3>Pizza</h3>
            <p class="price">₹199</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Burger">
            <h3>Burger</h3>
            <p class="price">₹129</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" alt="Noodles">
            <h3>Noodles</h3>
            <p class="price">₹149</p>
        </div>

    </div>

    <div class="offer" id="offers">
        <h2>Special Offer!</h2>
        <p>Get 20% OFF on your first order!</p>
    </div>

    <footer id="contact">
        <p>Contact: foodie@gmail.com</p>
        <p>© 2026 Foodie</p>
    </footer>

</body>
</html>
```
